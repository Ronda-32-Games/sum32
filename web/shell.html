<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<script>window.R32_T0 = performance.now();</script>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #F2EDE3; background: #151A2D; overflow: hidden; touch-action: none;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; background: #151A2D; }
#status .logo { font-size: 42px; font-weight: 800; letter-spacing: 2px; }
#status .bar { width: 55%; height: 8px; border-radius: 4px; background: #232A45; overflow: hidden; }
#status .fill { height: 100%; width: 0; background: #C5F04A; transition: width .15s; }
#status .pct { font-size: 14px; color: #F2EDE3B3; }
#status-notice { display: none; margin: 0 24px; padding: 14px; border-radius: 8px; background: #5b3943; text-align: center; }
#r32-btn { display: none; position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
  width: 44px; height: 44px; border-radius: 22px; border: 1px solid #F2EDE3B3; background: #232A45cc;
  color: #F2EDE3; font-size: 13px; font-weight: 700; }
#r32-panel { display: none; position: absolute; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom));
  z-index: 11; padding: 14px 16px; border-radius: 12px; background: #0d0b14f2; border: 1px solid #C5F04A;
  font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
  <div class="logo">SUM 32</div>
  <div class="bar"><div class="fill" id="status-fill"></div></div>
  <div class="pct" id="status-pct">Loading…</div>
  <div id="status-notice"></div>
</div>
<button id="r32-btn" type="button" aria-label="Load metrics">ms</button>
<div id="r32-panel"></div>

<script>
// Puente con Telegram, parámetros de prueba y panel de medición (Ronda 32).
(function () {
  const tg = (window.Telegram && window.Telegram.WebApp) || null;
  const inTelegram = !!(tg && tg.initData);
  const m = { shell: window.R32_T0, script: performance.now(), engine: null, first: null,
    fpsSamples: [], dragFpsMin: null, dragFpsSamples: [] };
  const BIG_MB = 5;  // más que esto bajado = el motor vino de internet (DEC-034)

  // Parámetros de prueba. En el navegador van en la dirección (?seed=32&round=5&slow=10&cold=1&test=1).
  // Dentro de Telegram, el link t.me/<bot>/sum32?startapp=test_seed32_round5_slow10_cold llega
  // como start_param (o tgWebAppStartParam en la dirección).
  function readParams() {
    const q = new URLSearchParams(location.search);
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    let start = '';
    try { start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; } catch (e) {}
    start = start || q.get('tgWebAppStartParam') || h.get('tgWebAppStartParam') || '';
    const p = { test: false, cold: false, seed: null, round: null, slow: null, start: start };
    function num(v) { return (v != null && /^\d+$/.test(String(v))) ? parseInt(v, 10) : null; }
    for (const tok of start.toLowerCase().split(/[_\-]+/)) {
      let mm;
      if (tok === 'test') p.test = true;
      else if (tok === 'cold') p.cold = true;
      else if ((mm = tok.match(/^seed(\d+)$/))) p.seed = num(mm[1]);
      else if ((mm = tok.match(/^round(\d+)$/))) p.round = num(mm[1]);
      else if ((mm = tok.match(/^slow(\d+)$/))) p.slow = num(mm[1]);
    }
    if (q.has('test')) p.test = true;
    if (q.has('cold')) p.cold = true;
    if (num(q.get('seed')) != null) p.seed = num(q.get('seed'));
    if (num(q.get('round')) != null) p.round = num(q.get('round'));
    if (num(q.get('slow')) != null) p.slow = num(q.get('slow'));
    if (p.round != null && p.round < 1) p.round = null;
    if (p.slow != null && p.slow < 1) p.slow = null;
    // Cualquier parámetro implica modo de prueba.
    if (p.cold || p.seed != null || p.round != null || p.slow != null) p.test = true;
    return p;
  }
  const P = readParams();

  // Modo frío (BUG-005): fuerza a bajar el motor y el juego de internet, salteando la caché.
  if (P.cold && window.fetch) {
    const origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const url = typeof input === 'string' ? input : ((input && input.url) || '');
      if (/\.(wasm|pck)(\?|$)/.test(url)) init = Object.assign({}, init || {}, { cache: 'reload' });
      return origFetch(input, init);
    };
  }

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#151A2D'); tg.setBackgroundColor('#151A2D'); }
    } catch (e) { console.warn('Telegram init', e); }
  }

  function fmt(ms) { return ms == null ? '—' : (ms / 1000).toFixed(2) + ' s'; }

  function transferred() {
    let net = 0, body = 0, reported = false, wasm = null;
    const entries = performance.getEntriesByType('navigation').concat(performance.getEntriesByType('resource'));
    for (const e of entries) {
      net += e.transferSize || 0;
      body += e.encodedBodySize || 0;
      if (e.transferSize > 0) reported = true;
      if (/\.wasm(\?|$)/.test(e.name)) wasm = e;
    }
    // De dónde vino el motor: se decide por lo que bajó el .wasm, no por un 0 exacto,
    // porque una revalidación (304) baja unos cientos de bytes y no es carga en frío.
    let engineFrom = 's/d';
    if (wasm && reported) {
      const mb = (wasm.transferSize || 0) / 1048576;
      if (mb > BIG_MB) engineFrom = 'network (' + mb.toFixed(1) + ' MB)';
      else if (mb < 1) engineFrom = 'cache';
      else engineFrom = 'unclear (' + mb.toFixed(1) + ' MB)';
    }
    return { net: net / 1048576, body: body / 1048576, engineFrom: engineFrom };
  }

  function avg(a) { return a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null; }

  function render() {
    const t = transferred();
    const lines = [
      'SUM 32 · load metrics',
      'Mode           : ' + (P.test ? 'test' + (P.start ? ' (' + P.start + ')' : '') : 'normal') + (P.cold ? ' · cold forced' : ''),
      '',
      'Screen visible : ' + fmt(m.script),
      'Engine ready   : ' + fmt(m.engine),
      'First frame    : ' + fmt(m.first),
      '',
      'Engine         : ' + t.engineFrom,
      'Downloaded     : ' + t.net.toFixed(2) + ' MB',
      'Compressed size: ' + t.body.toFixed(2) + ' MB',
      'FPS average    : ' + (avg(m.fpsSamples) ?? '—'),
      'FPS dragging   : ' + (avg(m.dragFpsSamples) ?? '—') + ' avg / ' + (m.dragFpsMin ?? '—') + ' min',
      '',
      'Telegram       : ' + (inTelegram ? (tg.platform + ' · Bot API ' + tg.version) : 'no (browser)'),
      'Screen         : ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1),
      'Device         : ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 110),
    ];
    document.getElementById('r32-panel').textContent = lines.join('\n');
  }

  // TASK-036: el panel de medición solo existe en modo de prueba.
  if (P.test) document.getElementById('r32-btn').style.display = 'block';
  document.getElementById('r32-btn').addEventListener('click', function () {
    const p = document.getElementById('r32-panel');
    const show = p.style.display !== 'block';
    if (show) render();
    p.style.display = show ? 'block' : 'none';
  });

  let wasHidden = false;
  function markHidden() { wasHidden = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) markHidden(); });
  window.addEventListener('pagehide', markHidden);
  document.addEventListener('freeze', markHidden);
  window.addEventListener('blur', markHidden);
  if (tg && tg.onEvent) { try { tg.onEvent('deactivated', markHidden); } catch (e) {} }

  // Analítica (TASK-063, privacy.html): solo dentro de Telegram y fuera del modo de prueba.
  // Abre sesión (cuenta al jugador del día), y cada 60 s o al ocultarse manda las partidas
  // terminadas y los segundos con la app visible. Si algo falla, el juego sigue igual.
  const API = 'https://sum32-api.REPLACE.workers.dev';
  const stats = (function () {
    const on = inTelegram && !P.test && API.indexOf('REPLACE') < 0;
    const pending = { practice_game: 0, app_seconds: 0 };
    let visibleSince = document.hidden ? null : Date.now();
    function send(path, body, keepalive) {
      if (!on) return;
      try {
        fetch(API + path, { method: 'POST', keepalive: !!keepalive, body: JSON.stringify(body || {}),
          headers: { 'Authorization': 'tma ' + tg.initData, 'Content-Type': 'application/json' } }).catch(function () {});
      } catch (e) {}
    }
    function collect() {
      if (visibleSince != null) {
        const now = Date.now();
        pending.app_seconds += Math.round((now - visibleSince) / 1000);
        visibleSince = document.hidden ? null : now;
      }
    }
    function flush(keepalive) {
      collect();
      const ev = {};
      for (const k in pending) if (pending[k] > 0) { ev[k] = pending[k]; pending[k] = 0; }
      if (Object.keys(ev).length) send('/event', { events: ev }, keepalive);
    }
    send('/session', {});
    setInterval(function () { if (!document.hidden) flush(false); }, 60000);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) flush(true); else visibleSince = Date.now();
    });
    window.addEventListener('pagehide', function () { flush(true); });
    return { add: function (k, n) { pending[k] += n; }, flush: function () { flush(false); }, enabled: on };
  }());
  // Funciones que llama Godot por JavaScriptBridge.
  window.r32 = {
    onGodotReady: function () {},
    onFirstFrame: function () { if (m.first == null) m.first = performance.now(); },
    reportFps: function (fps, dragging) {
      if (m.first == null) return;
      m.fpsSamples.push(fps);
      if (m.fpsSamples.length > 120) m.fpsSamples.shift();
      if (dragging) {
        m.dragFpsSamples.push(fps);
        m.dragFpsMin = m.dragFpsMin == null ? fps : Math.min(m.dragFpsMin, fps);
      }
    },
    haptic: function (kind) {
      if (!tg || !tg.HapticFeedback || !(tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'))) return;
      try {
        if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(['light', 'medium', 'heavy'].indexOf(kind) >= 0 ? kind : 'light');
      } catch (e) {}
    },
    topInsetCss: function () {
      if (!tg || !tg.isFullscreen) return 0;
      const a = tg.safeAreaInset || {}, b = tg.contentSafeAreaInset || {};
      return (a.top || 0) + (b.top || 0);
    },
    getBest: function () {
      try { return parseInt(localStorage.getItem('sum32_best') || '0', 10) || 0; } catch (e) { return 0; }
    },
    setBest: function (v) {
      try { localStorage.setItem('sum32_best', String(v)); } catch (e) {}
    },
    // BUG-004: con la página oculta Godot no recibe cuadros y no puede preguntar a tiempo.
    // La página anota que se ocultó y Godot lo lee (y lo borra) en el primer cuadro al volver.
    consumeHidden: function () {
      const now = document.hidden || !!(tg && tg.isActive === false);
      const was = wasHidden;
      wasHidden = false;
      return now || was;
    },
    roundEnd: function () { stats.add('practice_game', 1); stats.flush(); },
    metrics: m,
    params: P,
    engineFrom: function () { return transferred().engineFrom; },
  };
}());
</script>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const status = document.getElementById('status');
  const fill = document.getElementById('status-fill');
  const pct = document.getElementById('status-pct');
  const notice = document.getElementById('status-notice');

  function fail(err) {
    console.error(err);
    notice.textContent = (err && err.message) ? err.message : String(err);
    notice.style.display = 'block';
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('Missing browser features:\n' + missing.join('\n'));
    return;
  }
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        const p = Math.min(100, Math.round(current / total * 100));
        fill.style.width = p + '%';
        pct.textContent = p + '%';
      }
    },
  }).then(function () {
    window.r32.metrics.engine = performance.now();
    status.remove();
  }, fail);
}());
</script>
</body>
</html>
