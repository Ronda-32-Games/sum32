# Worker del servidor de Sum 32 (H2). Se publica desde GitHub Actions (.github/workflows/server.yml).
# Acá no va ningún secreto: BOT_TOKEN, DAILY_SECRET y STATS_TOKEN los carga Ignacio en el panel de Cloudflare.
name = "sum32-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Cuenta de Cloudflare del estudio (no es secreto; TASK-058).
account_id = "2ce5a265e8d93269cf3aa0780303b7b7"

[vars]
ALLOWED_ORIGIN = "https://ronda-32-games.github.io"
# "true" enciende la actividad y los eventos. Encendido el 31/10 con la página de privacidad
# provisoria (privacy.html en Pages); el texto final es TASK-064.
EVENTS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "sum32"
# El id de la base no es secreto (base creada por Ignacio el 30/10, TASK-058).
database_id = "a1e30ec2-5ac0-4b21-afb6-b0b0e219ddba"
migrations_dir = "migrations"

[triggers]
crons = []
