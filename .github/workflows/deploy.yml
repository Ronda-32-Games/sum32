# Cada cambio en main: corre las pruebas, exporta Sum 32 para web y lo publica en GitHub Pages.
name: Test, export and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATES_DIR: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-web

      - name: Download Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz 'templates/web_*' 'templates/version.txt' && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/$GODOT_TEMPLATES_DIR
          mv templates/* ~/.local/share/godot/export_templates/$GODOT_TEMPLATES_DIR/

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --import || true

      - name: Run tests
        run: |
          timeout 300 ~/godot/godot --headless -s tests/run_tests.gd | tee test.log
          grep -q "RESULT: OK" test.log
          timeout 300 ~/godot/godot --headless -s tests/run_view_tests.gd | tee view.log
          grep -q "RESULT: OK" view.log

      - name: Export web build
        run: |
          mkdir -p build/web
          timeout 600 ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          ls -la build/web

      - name: Install browser for web tests
        run: |
          python -m venv ~/webtest
          ~/webtest/bin/pip install -q playwright==1.63.0
          ~/webtest/bin/python -m playwright install --with-deps chromium

      - name: Run web tests
        run: timeout 900 ~/webtest/bin/python tests/web/test_shell.py build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
